      :root {
        --background: oklch(0.16 0.008 90);
        --foreground: oklch(0.94 0.012 90);
        --card: oklch(0.2 0.009 90);
        --primary: oklch(0.82 0.14 78);
        --accent: oklch(0.72 0.09 190);
        --muted-foreground: oklch(0.68 0.012 90);
        --border: oklch(0.3 0.01 90);
        --display: "Instrument Serif", Georgia, serif;
        --sans: "Work Sans", system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, monospace;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--background);
        color: var(--foreground);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        line-height: 1.55;
      }
      ::selection {
        background: color-mix(in oklab, var(--primary) 35%, transparent);
      }
      a {
        color: var(--primary);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .wrap {
        max-width: 52rem;
        margin: 0 auto;
        padding: 0 1.5rem 7rem;
      }
      .wrap.wide {
        max-width: 68rem;
      }
      .mono {
        font-family: var(--mono);
      }
      .eyebrow {
        font-family: var(--mono);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.28em;
        color: var(--muted-foreground);
      }
      h1, h2.display, h3.display {
        font-family: var(--display);
        font-weight: 400;
      }
      .muted {
        color: var(--muted-foreground);
      }
      header.bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1.5rem 0;
        font-size: 0.9rem;
      }
      header.bar nav {
        display: flex;
        gap: 1.5rem;
      }
      header.bar nav a {
        color: var(--muted-foreground);
      }
      header.bar nav a:hover {
        color: var(--foreground);
      }
      section {
        border-top: 1px solid var(--border);
        padding: 4rem 0;
      }
      section.hero {
        border-top: 0;
      }
      .hero h1 {
        font-size: clamp(2.5rem, 6.5vw, 3.6rem);
        line-height: 1.1;
        margin-top: 1.25rem;
      }
      .hero em {
        color: var(--primary);
        font-style: normal;
      }
      .lead {
        max-width: 44rem;
        color: var(--muted-foreground);
        font-size: 1.02rem;
        margin-top: 1.5rem;
        line-height: 1.65;
      }
      .belief {
        display: grid;
        grid-template-columns: 3rem 1fr;
        gap: 0.5rem;
        margin-top: 2rem;
      }
      .belief span.num {
        font-family: var(--mono);
        color: var(--primary);
      }
      .job {
        margin-top: 3.5rem;
      }
      .job-head {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: baseline;
        gap: 0.5rem;
      }
      .job h3 {
        font-family: var(--display);
        font-size: 1.85rem;
        font-weight: 400;
      }
      .job ul {
        list-style: none;
        margin-top: 1.25rem;
        display: grid;
        gap: 0.6rem;
      }
      .job li {
        color: var(--muted-foreground);
        font-size: 0.92rem;
        padding-left: 1.25rem;
        position: relative;
        line-height: 1.55;
      }
      .job li::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0.75em;
        width: 0.75rem;
        height: 1px;
        background: var(--border);
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 1.25rem;
      }
      .tag {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.25rem 0.75rem;
        font-family: var(--mono);
        font-size: 0.68rem;
        color: var(--muted-foreground);
      }
      .grid2 {
        display: grid;
        gap: 2rem;
        grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
        margin-top: 2.5rem;
      }
      .edu {
        list-style: none;
        margin-top: 2.5rem;
      }
      .edu li {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 0.5rem;
        border-bottom: 1px solid var(--border);
        padding-bottom: 1rem;
        margin-bottom: 1.5rem;
        font-family: var(--display);
        font-size: 1.25rem;
      }
      .edu li span:last-child {
        font-family: var(--sans);
        font-size: 0.85rem;
        color: var(--muted-foreground);
      }
      /* interactive styling */
      .spotlight {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background: radial-gradient(
          360px circle at var(--x, 50%) var(--y, 20%),
          color-mix(in oklab, var(--primary) 15%, transparent),
          transparent 70%
        );
      }
      .grid-field {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        opacity: 0.35;
        background-image:
          linear-gradient(to right, var(--border) 1px, transparent 1px),
          linear-gradient(to bottom, var(--border) 1px, transparent 1px);

        -webkit-mask-image: radial-gradient(ellipse at 50% 0%, black, transparent 75%);
        mask-image: radial-gradient(ellipse at 50% 0%, black, transparent 75%);

      .panel {
        position: relative;
        z-index: 1;
        border: 1px solid var(--border);
        border-radius: 1rem;
        background: color-mix(in oklab, var(--card) 75%, transparent);
        padding: 1.75rem;
        backdrop-filter: blur(6px);

      .dots span {
        display: inline-block;
        width: 0.6rem;
        height: 0.6rem;
        border-radius: 999px;
        margin-right: 0.4rem;
      }
      .caret {
        animation: blink 1s steps(2, start) infinite;
      }

        to { opacity: 0; }
      }
      .nodes {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1.5rem;
      }
      .node {
        flex: 1 1 11rem;
        text-align: left;
        cursor: pointer;
        border: 1px solid var(--border);
        border-radius: 0.6rem;
        background: transparent;
        color: var(--muted-foreground);
        font-family: var(--mono);
        font-size: 0.72rem;
        padding: 0.75rem 1rem;
        transition: all 0.25s;
      }
      .node:hover {
        color: var(--foreground);
        border-color: color-mix(in oklab, var(--primary) 60%, transparent);
      }
      .node[aria-pressed="true"] {
        border-color: var(--primary);
        color: var(--foreground);
        background: color-mix(in oklab, var(--primary) 12%, transparent);
      }
      .node b {
        display: block;
        font-family: var(--sans);
        font-weight: 500;
        font-size: 0.92rem;
        margin-top: 0.25rem;
      }
      .cards {
        display: grid;
        gap: 0.75rem;
        grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
        margin-top: 1.5rem;
      }
      .card {
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        background: color-mix(in oklab, var(--card) 45%, transparent);
        padding: 1.25rem;
        transition: transform 0.25s, border-color 0.25s;
      }
      .card:hover {
        transform: translateY(-3px);
        border-color: var(--primary);
      }
      .card h3 {
        font-family: var(--display);
        font-size: 1.25rem;
        font-weight: 400;
      }
      .card ul {
        list-style: none;
        margin-top: 0.75rem;
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--muted-foreground);
      }
      .marquee-wrap {
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 1rem 0;
        margin-top: 3.5rem;
      }
      .marquee {
        display: flex;
        width: max-content;
        animation: scroll 45s linear infinite;
        font-family: var(--mono);
        font-size: 0.85rem;
        color: var(--muted-foreground);
      }
      .marquee span {
        margin: 0 1.25rem;
        white-space: nowrap;
      }
      @keyframes scroll {
        to {
          transform: translateX(-50%);
        }
      }
      .tabs {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 1.25rem;
        z-index: 30;
        display: flex;
        gap: 0.25rem;
        padding: 0.3rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: color-mix(in oklab, var(--background) 88%, transparent);
        backdrop-filter: blur(10px);
      }
      .tabs button {
        font-family: var(--mono);
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        border: 0;
        background: transparent;
        color: var(--muted-foreground);
        border-radius: 999px;
        padding: 0.55rem 1.1rem;
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
      }
      .tabs button:hover {
        color: var(--foreground);
      }
      .tabs button[aria-selected="true"] {
        background: var(--primary);
        color: var(--background);
        font-weight: 600;
      }
      .interactive-console {
        margin-top: 1.5rem;
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        background: color-mix(in oklab, var(--background) 92%, transparent);
        padding: 1rem;
        font-family: var(--mono);
        font-size: 0.8rem;
      }
      .console-log {
        max-height: 160px;
        overflow-y: auto;
        color: var(--muted-foreground);
        margin-bottom: 0.75rem;
        line-height: 1.45;
      }
      .console-input-row {
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
      .console-input {
        background: transparent;
        border: none;
        outline: none;
        color: var(--foreground);
        font-family: var(--mono);
        font-size: 0.8rem;
        width: 100%;
      }
      @media (prefers-reduced-motion: reduce) {
        .marquee, .caret {
          animation: none;
        }
      }
    </style>
  </head>

            <h1 style="font-size:clamp(2.6rem,7vw,4.2rem);line-height:1.05;margin-top:.5rem">${profile.name}</h1>
            <p class="eyebrow" style="margin-top:.75rem">${profile.title}</p>
            <p class="mono" style="color:var(--accent);margin-top:1.75rem;font-size:.85rem">$ ls competencies</p>
            <p class="mono" style="color:var(--primary);font-size:1.5rem;margin-top:.5rem"><span id="typed"></span><span class="caret">▌</span></p>
            <p class="muted" style="margin-top:1.5rem;max-width:44rem">${profile.summary}</p>
          </div>

          <section style="border:0">
            <h2 class="eyebrow">Experience Timeline — Click stage to inspect</h2>
            <div class="nodes">
              ${work
                .map(
                  (w, i) =>
                    `<button class="node" aria-pressed="${i === active}" data-i="${i}">
                      <span>${w.period.split("–")[0].trim()}</span>
                      <b>${w.company}</b>
                    </button>`,
                )
                .join("")}
            </div>
            <div class="panel" style="margin-top:1.5rem">
              <div class="job-head">
                <h3 class="display" style="font-size:1.85rem">${j.role}</h3>
                <span class="eyebrow" style="color:var(--primary)">${j.period}</span>
              </div>
              <p class="muted" style="font-size:.9rem;margin-top:.25rem">${j.company} · ${j.place}</p>
              <p class="muted" style="margin-top:1rem;max-width:44rem">${j.summary}</p>
              <div class="cards">
                ${j.points.map((p) => `<div class="card muted" style="font-size:.86rem;line-height:1.5">${p}</div>`).join("")}
              </div>
              <div class="tags" style="margin-top:1.5rem">
                ${j.stack.map((s) => `<span class="tag" style="border-color:color-mix(in oklab,var(--primary) 40%,transparent);color:var(--primary)">${s}</span>`).join("")}
              </div>
            </div>
          </section>

          <div class="marquee-wrap">
            <div class="marquee">
              ${[...allStack, ...allStack].map((s) => `<span>${s} <b style="color:var(--primary)">/</b></span>`).join("")}
            </div>
          </div>

          <section style="border:0">
            <h2 class="eyebrow">Interactive CLI Console</h2>
            <div class="interactive-console">
              <div class="console-log" id="consoleLog">
                ${consoleLogs.map((l) => `<div>&gt; ${l}</div>`).join("")}
              </div>
              <form id="consoleForm" class="console-input-row" onsubmit="handleConsoleSubmit(event)">
                <span style="color:var(--accent)">$</span>
                <input type="text" id="consoleInput" class="console-input" placeholder="Type command here (try 'skills' or 'help')..." autocomplete="off" />
              </form>
            </div>
          </section>

          <section style="border:0">
            <h2 class="eyebrow">Skills Matrix</h2>
            <div class="cards">
              ${skills
                .map(
                  (s) =>
                    `<div class="card">
                      <h3>${s.group}</h3>
                      <ul>${s.items.map((i) => `<li>› ${i}</li>`).join("")}</ul>
                    </div>`,
                )
                .join("")}
            </div>
          </section>

          <section style="border:0">
            <h2 class="eyebrow">Education & Certifications</h2>
            <div class="cards">
              ${education.map(([t, s]) => `<div class="card"><h3>${t}</h3><p class="mono muted" style="font-size:.75rem;margin-top:.4rem">${s}</p></div>`).join("")}
              ${certifications.map(([t, s]) => `<div class="card"><h3>${t}</h3><p class="mono muted" style="font-size:.75rem;margin-top:.4rem">${s}</p></div>`).join("")}
            </div>
          </section>

          <div class="panel">
            <p class="mono" style="color:var(--accent);font-size:.85rem">$ open connection</p>
            <h2 class="display" style="font-size:2.5rem;line-height:1.15;margin-top:.75rem">Let's build reliable reporting solutions.</h2>
            ${contact}
          </div>
        </div>`;
      }

      let typeTimer;
      function startTypewriter() {
        clearTimeout(typeTimer);
        const el = document.getElementById("typed");
        if (!el) return;
        const words = [
          "Azure Data Factory pipelines",
          "Medallion Architecture (Bronze/Silver/Gold)",
          "Databricks & PySpark optimization",
          "Power BI semantic modeling & DAX",
          "Healthcare reporting & governance",
          "KQL diagnostics & Log Analytics",
        ];
        let i = 0,
          n = 0,
          deleting = false;
        (function tick() {
          const word = words[i % words.length];
          n += deleting ? -1 : 1;
          el.textContent = word.slice(0, n);
          let delay = deleting ? 35 : 65;
          if (!deleting && n === word.length) {
            deleting = true;
            delay = 1800;
          } else if (deleting && n === 0) {
            deleting = false;
            i++;
            delay = 200;
          }
          typeTimer = setTimeout(tick, delay);
        })();
      }

      function handleConsoleSubmit(e) {
        e.preventDefault();
        const input = document.getElementById("consoleInput");
        const val = input.value.trim().toLowerCase();
        if (!val) return;
        input.value = "";

        consoleLogs.push(val);
        switch (val) {
          case "help":
            consoleLogs.push("Available commands: roles, skills, certifications, contact, clear, whoami");
            break;
          case "whoami":
            consoleLogs.push(`${profile.name} — ${profile.title}. Open for Data Engineer, Data Analytics Engineer, or Analytics Engineer roles based in ${profile.location}`);
            break;
          case "roles":
            work.forEach((w) => consoleLogs.push(`• ${w.role} @ ${w.company} (${w.period})`));
            break;
          case "skills":
            skills.forEach((s) => consoleLogs.push(`[${s.group}]: ${s.items.join(", ")}`));
            break;
          case "certifications":
            certifications.forEach(([c, code]) => consoleLogs.push(`• ${c} (${code})`));
            break;
          case "contact":
            consoleLogs.push(`Email: ${profile.email} | Phone: ${profile.phone} | LinkedIn: ${profile.linkedin}`);
            break;
          case "clear":
            consoleLogs = [];
            break;
          default:
            consoleLogs.push(`Command not recognized: '${val}'. Type 'help' for options.`);
        }
        const logBox = document.getElementById("consoleLog");
        if (logBox) {
          logBox.innerHTML = consoleLogs.map((l) => `<div>&gt; ${l}</div>`).join("");
          logBox.scrollTop = logBox.scrollHeight;
        }
      }

      function render() {
        app.innerHTML = theme === "classic" ? classicView() : interactiveView();
        document
          .querySelectorAll("#tabs button")
          .forEach((b) =>
            b.setAttribute("aria-selected", String(b.dataset.theme === theme)),
          );
        if (theme === "interactive") {
          startTypewriter();
          app.querySelectorAll(".node").forEach((btn) =>
            btn.addEventListener("click", () => {
              active = Number(btn.dataset.i);
              render();
            }),
          );
          const logBox = document.getElementById("consoleLog");
          if (logBox) logBox.scrollTop = logBox.scrollHeight;
        }
      }

      document.querySelectorAll("#tabs button").forEach((btn) =>
        btn.addEventListener("click", () => {
          if (theme === btn.dataset.theme) return;
          theme = btn.dataset.theme;
          location.hash = theme === "interactive" ? "#interactive" : "";
          render();
          scrollTo({ top: 0 });
        }),
      );

      window.addEventListener("pointermove", (e) => {
        const spot = document.getElementById("spot");
        if (spot) {
          spot.style.setProperty("--x", e.clientX + "px");
          spot.style.setProperty("--y", e.clientY + "px");
        }
      });

      render();
    </script>
  </body>
</html>
